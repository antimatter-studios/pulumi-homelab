name: Release

# A reusable release: work out the next semver version from the conventional-commit subjects since
# the last v* tag, and when one is due, tag the given commit, build the plugin for each platform with
# the version in its ldflags, and publish a GitHub release whose notes are the CHANGELOG.md entries
# added under "## Unreleased" since the previous tag (scripts/release.sh).
#
# The plugin release tag points to an existing green main commit. The Go module tag points to a
# separate commit with the SDK version stamped in. The release script comes from this repository's
# main.
on:
  workflow_call:
    inputs:
      binary:
        description: The plugin binary, pulumi-resource-<name>, built from provider/cmd/<binary>.
        type: string
        required: true
      sha:
        description: The commit on main to release; its CI has passed.
        type: string
        required: true
      version:
        description: X.Y.Z of a tag that already exists (pushed by hand); empty to work it out and tag.
        type: string
        required: false
        default: ''

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0

      - uses: actions/checkout@v4
        with:
          repository: antimatter-studios/pulumi-homelab
          ref: main
          path: .release-tools

      - name: The commit is on main and its CI passed
        # Releases happen only from green main, whoever pushed the tag.
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.sha }}
        run: |
          git fetch --quiet origin main
          git merge-base --is-ancestor "$SHA" origin/main || { echo "$SHA is not on main" >&2; exit 1; }
          ci="$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/check-runs?check_name=CI" --jq '[.check_runs[] | select(.conclusion == "success")] | length')"
          [ "$ci" -gt 0 ] || { echo "CI has not passed on $SHA" >&2; exit 1; }

      - name: Next version and notes
        id: next
        env:
          GIVEN: ${{ inputs.version }}
        run: |
          if [ -n "$GIVEN" ]; then
            v="${GIVEN#v}"
            # the tag exists already, so the notes run from the tag before it
            export LAST="$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' "v$v^" 2>/dev/null || true)"
          else
            v="$(.release-tools/scripts/release.sh next)"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "version: ${v:-none, no feat or fix since the last tag}"
          # before tagging, so "since the last tag" means the previous release
          [ -z "$v" ] || .release-tools/scripts/release.sh notes > "$RUNNER_TEMP/notes.md"

      - uses: actions/upload-artifact@v4
        if: steps.next.outputs.version != ''
        with:
          name: notes
          path: ${{ runner.temp }}/notes.md

      - name: Tag
        if: steps.next.outputs.version != '' && inputs.version == ''
        env:
          V: ${{ steps.next.outputs.version }}
        run: |
          git tag "v$V" "${{ inputs.sha }}"
          git push origin "refs/tags/v$V"

  build:
    needs: version
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [darwin-arm64, linux-amd64, linux-arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.version.outputs.version }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: provider/go.mod
          cache-dependency-path: provider/go.sum

      - name: Build
        # pulumi-resource-<name>-v<version>-<os>-<arch>.tar.gz is the asset name Pulumi's github://
        # plugin downloader asks for.
        working-directory: provider
        env:
          V: ${{ needs.version.outputs.version }}
          T: ${{ matrix.target }}
          BINARY: ${{ inputs.binary }}
          CGO_ENABLED: '0'
        run: |
          export GOOS="${T%-*}" GOARCH="${T#*-}"
          module="$(go list -m)"
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X $module.Version=$V" -o "dist/$BINARY" "./cmd/$BINARY"
          tar -czf "$BINARY-v$V-$T.tar.gz" -C dist "$BINARY"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: provider/*.tar.gz

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.version.outputs.version }}
          path: src

      - name: Node.js SDK
        # The SDK as committed says version 0.0.0-dev, and a program using it asks Pulumi for the
        # plugin of the SDK's version. The packed copy carries the release's version (package.json,
        # and bin/package.json, which the compiled SDK reads), so it asks for the plugin published
        # beside it. Projects pin it by URL: .../releases/download/vX.Y.Z/<package>-X.Y.Z.tgz.
        working-directory: src/sdk/nodejs
        env:
          V: ${{ needs.version.outputs.version }}
        run: |
          node -e '
            const fs = require("fs");
            for (const file of ["package.json", "bin/package.json"]) {
              const pkg = JSON.parse(fs.readFileSync(file, "utf8"));
              pkg.version = process.env.V;
              pkg.pulumi.version = process.env.V;
              fs.writeFileSync(file, JSON.stringify(pkg, null, 4) + "\n");
            }'
          npm pack --pack-destination "$GITHUB_WORKSPACE/dist"

      - name: Go SDK
        # Go resolves subdirectory modules from prefixed tags. The stamped commit is reachable
        # through the Go module tag, while vX.Y.Z still points to the green main commit.
        working-directory: src
        env:
          V: ${{ needs.version.outputs.version }}
        run: |
          python3 - "$V" <<'PY'
          from pathlib import Path
          import sys

          version = sys.argv[1]
          replacements = [
              ("pulumi-plugin.json", '"version": "0.0.0-dev"', f'"version": "{version}"', 1),
              ("internal/pulumiUtilities.go", 'semver.MustParse("0.0.0-dev")',
               f'semver.MustParse("{version}")', 2),
              ("internal/pulumiVersion.go", '= semver.Version{}', f'= semver.MustParse("{version}")', 1),
          ]
          for name, original, stamped, count in replacements:
              path = Path("sdk/go") / name
              source = path.read_text()
              if source.count(original) != count:
                  sys.exit(f"{path}: expected {count} occurrences of {original}")
              path.write_text(source.replace(original, stamped))
          PY

          # Use the release commit's timestamp so a rerun produces the same tagged commit.
          release_date="$(git show -s --format=%cI HEAD)"
          export GIT_AUTHOR_DATE="$release_date" GIT_COMMITTER_DATE="$release_date"
          git add sdk/go
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "Stamp Go SDK for v$V"
          git push origin "HEAD:refs/tags/sdk/go/v$V"

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ needs.version.outputs.version }}
        run: |
          gh release create "v$V" dist/*.tar.gz dist/*.tgz --repo "$GITHUB_REPOSITORY" \
            --title "v$V" --notes-file dist/notes.md --verify-tag
