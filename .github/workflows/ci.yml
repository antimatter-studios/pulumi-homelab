name: CI

on:
  pull_request:
  push:
    branches: [main]

# A pull request that is superseded is not worth finishing.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Ubuntu on purpose rather than for convenience. This package reads machines with GNU coreutils
    # — `stat -c`, `dpkg-query`, `systemctl` — and six tests that exercise resources against a real
    # filesystem skip on macOS because BSD `stat` rejects `-c`. Here they run, which is the only
    # place they do.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          # 22 is the oldest release with `--experimental-strip-types`, which the package checks use
          # to load this package the way Pulumi does.
          node-version: 22
          cache: pnpm

      - name: Install
        # --frozen-lockfile so a drifted lockfile fails here rather than resolving to something
        # nobody tested.
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm run test:unit

      - name: Package checks
        # Deliberately separate from the unit tests: these run under plain node because vitest's
        # module transform rewrites imports into captured variables, which is exactly the shape
        # Pulumi's serialiser rejects — so a vitest version of these checks fails on correct code.
        run: pnpm run check:serialise

      - name: Provider revision
        # A change to what a resource reads is inert on every resource that already exists until
        # TRANSPORT moves, because each one runs the closure stored in its own state. That was got
        # wrong three times before this check existed, so it is asked here rather than remembered.
        run: pnpm run check:revision

  go:
    # The Go provider plugin that replaces the dynamic providers in src/ (#31). It lives in its own
    # module under provider/, so everything here runs from there.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: provider
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: provider/go.mod
          cache-dependency-path: provider/go.sum

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Integration tests (Debian 13 sshd in Docker)
        run: go test -tags integration -run Debian13 ./transport/

      - uses: pulumi/actions@v6
        with:
          pulumi-version: 3.150.0

      - name: SDK is up to date
        # sdk/nodejs is generated from the plugin's schema and committed; regenerate it and fail when
        # it differs, so a provider change cannot land without the SDK that consumers link.
        working-directory: .
        run: |
          ./scripts/gen-sdk.sh
          git diff --exit-code -- sdk/nodejs
          test -z "$(git status --porcelain -- sdk/nodejs)"

      - name: Release dry run
        # What the next merge to main would release, computed from the real history, and its notes.
        # A changelog.d fragment with a name the notes cannot place fails here, not at release time.
        working-directory: .
        run: |
          git fetch --tags --unshallow --quiet || git fetch --tags --quiet
          echo "next release: $(./scripts/release.sh next || true)"
          ./scripts/release.sh notes

  ci:
    # One always-run job for branch protection to require, so the jobs above can be renamed, split
    # into a matrix or made conditional without ever stranding a merge on a check that never reports.
    name: CI
    needs: [test, go]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Result
        run: |
          for result in '${{ needs.test.result }}' '${{ needs.go.result }}'; do
            case "$result" in
              success|skipped) ;;
              *) echo "a required job did not pass: $result" >&2; exit 1 ;;
            esac
          done
          echo 'ok'
