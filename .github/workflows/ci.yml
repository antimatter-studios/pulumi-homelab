name: CI

on:
  pull_request:
  push:
    branches: [main]

# A pull request that is superseded is not worth finishing.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Ubuntu on purpose rather than for convenience. This package reads machines with GNU coreutils
    # — `stat -c`, `dpkg-query`, `systemctl` — and six tests that exercise resources against a real
    # filesystem skip on macOS because BSD `stat` rejects `-c`. Here they run, which is the only
    # place they do.
    # Temporarily hosted: back to ryzen-linux-x64 once homelab-server #165 is deployed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          # 22 is the oldest release with `--experimental-strip-types`, which the package checks use
          # to load this package the way Pulumi does.
          node-version: 22
          cache: pnpm

      - name: Install
        # --frozen-lockfile so a drifted lockfile fails here rather than resolving to something
        # nobody tested.
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm run test:unit

      - name: Package checks
        # Deliberately separate from the unit tests: these run under plain node because vitest's
        # module transform rewrites imports into captured variables, which is exactly the shape
        # Pulumi's serialiser rejects — so a vitest version of these checks fails on correct code.
        run: pnpm run check:serialise

      - name: Provider revision
        # A change to what a resource reads is inert on every resource that already exists until
        # TRANSPORT moves, because each one runs the closure stored in its own state. That was got
        # wrong three times before this check existed, so it is asked here rather than remembered.
        run: pnpm run check:revision

  # test, go and the CI gate run on the homelab's own ARC runners (ryzen-linux-x64). On a public
  # repository that is safe only while fork pull requests need approval before they run: the
  # organisation and repository setting must stay "all_external_contributors".
  go:
    # The Go provider plugin that replaces the dynamic providers in src/ (#31). It lives in its own
    # module under provider/, so everything here runs from there.
    # Temporarily hosted: back to ryzen-linux-x64 once homelab-server #165 is deployed.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: provider
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: provider/go.mod
          cache-dependency-path: provider/go.sum

      # node for jscompat's differential test, which compares the package with JavaScript itself.
      # Pinned, and required: without node that test would only skip, and nobody would notice.
      - uses: actions/setup-node@v4
        with:
          node-version: 24.11.1

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...
        env:
          JSCOMPAT_REQUIRE_NODE: '1'

      - name: jscompat against node
        # The same test, shown: which node and Unicode it compared against, and that it ran.
        env:
          JSCOMPAT_REQUIRE_NODE: '1'
        run: go test -v -count=1 -run TestAgainstNode ./jscompat/

      - uses: pulumi/actions@v6
        with:
          pulumi-version: 3.150.0

      - name: SDK is up to date
        working-directory: .
        run: |
          ./scripts/gen-sdk.sh
          git diff --exit-code -- sdk/nodejs sdk/go
          test -z "$(git status --porcelain -- sdk/nodejs sdk/go)"

      - name: Build Go SDK
        working-directory: sdk/go
        run: go build ./...

      - name: Release dry run
        # What the next merge to main would release, computed from the real history, and its notes.
        # A changelog.d fragment with a name the notes cannot place fails here, not at release time.
        working-directory: .
        run: |
          git fetch --tags --unshallow --quiet || git fetch --tags --quiet
          echo "next release: $(./scripts/release.sh next || true)"
          ./scripts/release.sh notes

  integration:
    # Pull requests do not wait for this: the integration suites run locally before every push, and
    # GitHub-hosted runners are shared with other repositories and often queued. It runs on main.
    if: github.event_name == 'push'
    # The Debian 13 container suites. They need real Docker (an sshd container with a published port,
    # its own networks, privileged systemd containers), which the Ryzen runners do not offer: Docker
    # there is rootless podman in an unprivileged sidecar. So this job alone stays on GitHub-hosted
    # runners; everything else runs on the Ryzen.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: provider
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: provider/go.mod
          cache-dependency-path: provider/go.sum

      - name: Integration tests (Debian 13 containers)
        # Every integration suite in the module, so a new one is picked up without a CI change.
        run: go test -count=1 -tags integration ./...

  ci:
    # One always-run job for branch protection to require, so the jobs above can be renamed, split
    # into a matrix or made conditional without ever stranding a merge on a check that never reports.
    name: CI
    needs: [test, go, integration]
    if: always()
    # Temporarily hosted: back to ryzen-linux-x64 once homelab-server #165 is deployed.
    runs-on: ubuntu-latest
    steps:
      - name: Result
        run: |
          for result in '${{ needs.test.result }}' '${{ needs.go.result }}' '${{ needs.integration.result }}'; do
            case "$result" in
              success|skipped) ;;
              *) echo "a required job did not pass: $result" >&2; exit 1 ;;
            esac
          done
          echo 'ok'
